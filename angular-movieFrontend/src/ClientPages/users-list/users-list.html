<section class="film-listings container my-4">
  <h2>Twoje Listy</h2>

  <!-- Przełącznik kategorii statusu (Planned, InProgress itp.) -->
  <div class="d-flex gap-2 mb-3">
    <button 
      class="btn" 
      [class.btn-primary]="selectedType === null" 
      [class.btn-outline-primary]="selectedType !== null"
      (click)="onTypeChange(null)">
      Wszystkie
    </button>
    <button 
      class="btn" 
      [class.btn-primary]="selectedType === 'Planned'" 
      [class.btn-outline-primary]="selectedType !== 'Planned'"
      (click)="onTypeChange('Planned')">
      Planowane
    </button>
    <button 
      class="btn" 
      [class.btn-primary]="selectedType === 'InProgress'" 
      [class.btn-outline-primary]="selectedType !== 'InProgress'"
      (click)="onTypeChange('InProgress')">
      W trakcie
    </button>
    <button 
      class="btn" 
      [class.btn-primary]="selectedType === 'Completed'" 
      [class.btn-outline-primary]="selectedType !== 'Completed'"
      (click)="onTypeChange('Completed')">
      Obejrzane
    </button>
  </div>

  <div class="btn-group mb-4" role="group">
    <input 
      type="radio" 
      class="btn-check" 
      name="voteFilter" 
      id="voteAll" 
      [checked]="selectedVote === null"
      (change)="onVoteChange(null)">
    <label class="btn btn-outline-secondary" for="voteAll">Wszystkie oceny</label>

    <input 
      type="radio" 
      class="btn-check" 
      name="voteFilter" 
      id="voteLiked" 
      [checked]="selectedVote === 'Liked'"
      (change)="onVoteChange('Liked')">
    <label class="btn btn-outline-success" for="voteLiked"> Polubione</label>

    <input 
      type="radio" 
      class="btn-check" 
      name="voteFilter" 
      id="voteDisliked" 
      [checked]="selectedVote === 'Disliked'"
      (change)="onVoteChange('Disliked')">
    <label class="btn btn-outline-danger" for="voteDisliked"> Niepolubione</label>
  </div>

  <!-- Lista filmów -->
  @for(item of items; track item.id) {
    <div class="film-card mb-3 p-3 border rounded">
      <div class="movie-details">
        <div class="film-info">
          <h3>{{ item.title }}</h3>
          <p>
            <span class="badge bg-warning text-dark me-2">⭐ {{ item.mediaStats?.averageRating ?? 'Brak ocen' }}</span>
            <span class="badge bg-info text-dark">{{ item.genre?.name }}</span>
          </p>
          <p class="description">{{ item.description }}</p>
        </div>

        <a class="btn btn-primary" >
          Więcej...[routerLink]="['/movie', item.id]"
        </a>
      </div>
    </div>
  }
  @empty {
    <p class="text-muted">Brak mediów w wybranej kategorii.</p>
  }
</section>
