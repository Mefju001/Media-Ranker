services:
  db:
    image: postgres:16-alpine
    container_name: movie-postgres-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - movie-network

  web-api:
    container_name: movie-api
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - movie-network
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};
      - Jwt__Key=${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
        
  web-client:
    container_name: movie-client
    build:
      context: ./angular-movieFrontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web-api
    networks:
      - movie-network
volumes:
  postgres_data:
  
networks:
  movie-network:
    driver: bridge